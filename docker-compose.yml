services:
  db:
    # Образ берется с Docker Hub. Если он недоступен, задайте зеркало переменной окружения:
    #   PowerShell: $env:POSTGRES_IMAGE="mirror.gcr.io/library/postgres:18"
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_DB: equipment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # В образе PostgreSQL 18 данные лежат в /var/lib/postgresql/18/..., поэтому монтируем родительский каталог.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipment"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=equipment;Username=postgres;Password=postgres;GSS Encryption Mode=Disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
